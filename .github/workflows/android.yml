name: Android builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign universal APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and pinned libnfs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-24.04 supplies the SDK, NDK, CMake and Ninja selected by build.mill.

      - name: Cache downloaded dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: ${{ runner.os }}-mill-

      - name: Build and verify universal debug and release variants
        run: scripts/build-apks.sh

      - name: Sign and verify the release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/sign-release.py

      - name: Upload signed universal debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/artifacts/debug/nfs-saf-debug-universal.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed universal release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/artifacts/release/nfs-saf-release-universal.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Summarize artifacts
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          {
            echo '### Universal Android APKs'
            echo 'Both APKs support ARM64 and x86-64, Android 9 or newer.'
            echo 'Debug: signed with the CI debug key.'
            echo 'Push/manual runs: release signed with the configured release key.'
            echo 'Pull requests: release compilation is checked without access to signing secrets.'
            echo "Source commit: $SOURCE_COMMIT"
            echo 'Artifacts download directly as APK files. SHA-256 checksums:'
            echo '```text'
            cat out/artifacts/*/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
