name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Storage, contracts and signing tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and pinned libnfs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-24.04 supplies the SDK/NDK, CMake, Ninja and Clang.
      - name: Cache downloaded dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: ${{ runner.os }}-mill-

      - name: Check storage and static contracts
        run: |
          ./mill core.test + core.contractCheck + native.test
          python3 scripts/network-tests.py
          scripts/sanitizer-test.sh

      - name: Compile instrumentation and the unsigned signing fixture
        run: ./mill app.androidTest.androidTestApk + release.androidAlignedUnsignedApk

      - name: Test signing and failure cleanup with a disposable key
        run: python3 scripts/test-signing.py
